# Runs gomuks web (wasm backend, browser-only) as a static site on
# http://127.0.0.1:8181 without a reverse proxy. See docs/wasmuks.md.
#
#   cp config.example.json config.json   # optional: default preferences and wasm tuning
#   docker compose -f docker-compose.wasmuks.yml pull
#   docker compose -f docker-compose.wasmuks.yml up -d
services:
  gomuks-web:
    image: ghcr.io/palchrb/gomuks-web:latest
    # To build locally instead of pulling (needs ~4 GB RAM; not on a Raspberry Pi):
    # build:
    #   context: .
    #   dockerfile: Dockerfile.wasmuks
    ports:
      - "127.0.0.1:8181:8181"
    environment:
      WASMUKS_CONFIG: /config.json
    volumes:
      # Optional; served as config.json if the file exists.
      - ./config.json:/config.json:ro
    mem_limit: 64m
    restart: unless-stopped
