# nginx site config for the wasmuks image (Dockerfile.wasmuks).
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The build stage pre-compresses everything; serve the .gz files directly.
	gzip_static on;

	# Entry points that must always be fresh.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}
	location = /config.json {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}
	location = /wasmuks-media-sw.js {
		add_header Cache-Control "no-cache";
		add_header Service-Worker-Allowed "/";
	}

	# Content-hashed assets, including the wasm binary.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
